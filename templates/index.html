<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Chatbot</title>
    <link rel="stylesheet" 
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span class="bot-icon">🤖</span>
            <div>
                <h2>AI Chatbot</h2>
                <p>Built with Python, NLP & Flask</p>
            </div>
        </div>

        <div id="chatbox">
            <div class="message bot-message">
                <div class="avatar bot-avatar">🤖</div>
                <div>
                    <div class="bubble">Hello! How can I help you? 😊</div>
                    <div class="timestamp">Just now</div>
                </div>
            </div>
            <div class="message bot-message" 
                 id="typing" style="display:none;">
                <div class="avatar bot-avatar">🤖</div>
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="quick-replies">
            <button onclick="quickSend('Hello')">Hello</button>
            <button onclick="quickSend('What can you do?')">
                What can you do?</button>
            <button onclick="quickSend('Thank you')">Thank you</button>
            <button onclick="quickSend('Bye')">Bye</button>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" 
                   placeholder="Type your message..."
                   onkeydown="if(event.key==='Enter') sendMessage()" />
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        function getTime() {
            return new Date().toLocaleTimeString([],
                { hour: '2-digit', minute: '2-digit' });
        }

        function addMessage(text, sender) {
            const chatbox = document.getElementById('chatbox');
            const typing = document.getElementById('typing');
            const isUser = sender === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 
                isUser ? 'user-message' : 'bot-message');
            msgDiv.innerHTML = isUser
                ? `<div>
                     <div class="bubble">${text}</div>
                     <div class="timestamp">${getTime()}</div>
                   </div>
                   <div class="avatar user-avatar">R</div>`
                : `<div class="avatar bot-avatar">🤖</div>
                   <div>
                     <div class="bubble">${text}</div>
                     <div class="timestamp">${getTime()}</div>
                   </div>`;
            chatbox.insertBefore(msgDiv, typing);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            input.value = '';
            const typing = document.getElementById('typing');
            typing.style.display = 'flex';
            document.getElementById('chatbox').scrollTop =
                document.getElementById('chatbox').scrollHeight;
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                typing.style.display = 'none';
                addMessage(data.bot, 'bot');
            })
            .catch(() => {
                typing.style.display = 'none';
                addMessage('Sorry, something went wrong!', 'bot');
            });
        }

        function quickSend(msg) {
            document.getElementById('user-input').value = msg;
            sendMessage();
        }
    </script>
</body>
</html>
